name: Feature request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      multiple: true
      options: [server, web]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
